name: aquarium-monitoring

services:
  grafana:
    build:
      context: ..
      dockerfile: docker/grafana-infisical.Dockerfile
    entrypoint: ["/opt/aquarium-scripts/grafana-infisical-entrypoint.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      INFISICAL_DISABLE_UPDATE_CHECK: "true"
      GF_SERVER_HTTP_PORT: 3000
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - ../scripts:/opt/aquarium-scripts:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    restart: unless-stopped
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - observability

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./data/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    restart: unless-stopped
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      observability:
        aliases:
          - alloy.local

  loki:
    image: grafana/loki:latest
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ./data/loki:/var/lib/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-13100}:3100"
    restart: unless-stopped
    networks:
      - observability

  tempo:
    image: grafana/tempo:latest
    command:
      - -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ./data/tempo:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-13200}:3200"
    restart: unless-stopped
    networks:
      - observability

  mimir:
    image: grafana/mimir:latest
    command:
      - -target=all
      - -config.file=/etc/mimir/mimir.yaml
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - ./data/mimir:/var/lib/mimir
    ports:
      - "127.0.0.1:${MIMIR_PORT:-13300}:9009"
    restart: unless-stopped
    networks:
      - observability

networks:
  observability:
    name: aquarium-monitoring
