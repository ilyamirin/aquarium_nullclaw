name: aquarium-nullclaw-probe

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/nullclaw-infisical.Dockerfile
    image: ${NULLCLAW_IMAGE:-aquarium/nullclaw-infisical:latest}
    entrypoint: ["/opt/aquarium-scripts/nullclaw-infisical-entrypoint.sh"]
    command: ["gateway", "--host", "::", "--port", "3000"]
    env_file:
      - path: .env
        required: false
    environment:
      NULLCLAW_HOME: /nullclaw-data
      NULLCLAW_RENDER_CONFIG_SCRIPT: /opt/stack-scripts/render-config.sh
      NULLCLAW_GATEWAY_PORT: ${NULLCLAW_GATEWAY_PORT:-3002}
      NULLCLAW_GATEWAY_HOST: ${NULLCLAW_GATEWAY_HOST:-127.0.0.1}
    ports:
      - "127.0.0.1:${NULLCLAW_GATEWAY_PORT:-3002}:3000"
    volumes:
      - ./data:/nullclaw-data
      - ../scripts:/opt/aquarium-scripts:ro
      - ./scripts:/opt/stack-scripts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  agent-cli:
    image: ${NULLCLAW_IMAGE:-aquarium/nullclaw-infisical:latest}
    profiles: ["cli"]
    stdin_open: true
    tty: true
    entrypoint: ["/opt/aquarium-scripts/nullclaw-infisical-entrypoint.sh"]
    command: ["agent"]
    env_file:
      - path: .env
        required: false
    environment:
      NULLCLAW_HOME: /nullclaw-data
      NULLCLAW_RENDER_CONFIG_SCRIPT: /opt/stack-scripts/render-config.sh
      NULLCLAW_GATEWAY_PORT: ${NULLCLAW_GATEWAY_PORT:-3002}
      NULLCLAW_GATEWAY_HOST: ${NULLCLAW_GATEWAY_HOST:-127.0.0.1}
    volumes:
      - ./data:/nullclaw-data
      - ../scripts:/opt/aquarium-scripts:ro
      - ./scripts:/opt/stack-scripts:ro
