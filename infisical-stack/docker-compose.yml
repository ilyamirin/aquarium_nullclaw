name: aquarium-infisical

services:
  backend:
    image: infisical/infisical:latest
    env_file:
      - path: .env
        required: false
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      DB_CONNECTION_URI: postgresql://infisical:${POSTGRES_PASSWORD}@db:5432/infisical
      REDIS_URL: redis://redis:6379
      SITE_URL: ${SITE_URL:-http://127.0.0.1:18080}
      PORT: 8080
      HTTPS_ENABLED: "false"
    ports:
      - "127.0.0.1:${INFISICAL_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data/backend:/var/opt/infisical
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
