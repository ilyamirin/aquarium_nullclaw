name: aquarium-perimeter

services:
  caddy:
    image: caddy:2
    ports:
      - "${PERIMETER_HTTP_PORT:-80}:80"
      - "${PERIMETER_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - authelia
      - controlplane
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - perimeter
      - infisical
      - monitoring

  authelia:
    image: authelia/authelia:latest
    env_file:
      - path: .env
        required: false
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml:ro
    networks:
      - perimeter

  controlplane:
    build:
      context: ..
      dockerfile: docker/controlplane.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CONTROLPLANE_PUBLIC_URL: ${CONTROLPLANE_PUBLIC_URL:-https://app.aquarium.local}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-https://grafana.aquarium.local}
      SECRETS_PUBLIC_URL: ${SECRETS_PUBLIC_URL:-https://secrets.aquarium.local}
      AUTHELIA_PUBLIC_URL: ${AUTHELIA_PUBLIC_URL:-https://auth.aquarium.local}
      AUTHELIA_LOGIN_URL: ${AUTHELIA_PUBLIC_URL:-https://auth.aquarium.local}
      AUTHELIA_LOGOUT_URL: ${AUTHELIA_PUBLIC_URL:-https://auth.aquarium.local}/logout
      AUTHELIA_HEADER_USER: HTTP_REMOTE_USER
      GRAFANA_INTERNAL_URL: http://aquarium-grafana:3000
      INFISICAL_API_URL: http://backend:8080
    volumes:
      - ..:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - perimeter
      - infisical
      - monitoring

networks:
  perimeter:
    name: aquarium-perimeter
  infisical:
    external: true
    name: aquarium-infisical_default
  monitoring:
    external: true
    name: aquarium-monitoring
